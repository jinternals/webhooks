# ⚠️ DEMO ONLY — public sample secrets. Supply real secrets/keys from a secret manager in production.
server:
  port: 9094
  shutdown: graceful

sample:
  auth:
    jwt-secret: ${WEBHOOK_JWT_SECRET:demo-jwt-hs256-signing-key-at-least-32-bytes}
    issuer: ${WEBHOOK_JWT_ISSUER:https://producer.webhooks.local}
    audience: ${WEBHOOK_JWT_AUDIENCE:webhooks-consumer}

webhooks:
  producer:
    destinations:
      crm:
        url: ${CRM_WEBHOOK_URL:http://localhost:9095/webhooks/crm}
        secret: ${CRM_WEBHOOK_SECRET:whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw}

management:
  endpoints:
    web:
      exposure:
        include: health, info
