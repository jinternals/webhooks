# ⚠️ DEMO ONLY — the secret/key defaults below are PUBLIC (published in this repo). Never use them in
# production: supply your own via CRM_WEBHOOK_SECRET, CRM_V2A_PUBLIC_KEY, BILLING_WEBHOOK_SECRET, etc.
# whsec_MfKQ… is the Standard Webhooks spec's test secret; the whpk_ key is a sample-only key pair.
server:
  port: 9091

webhooks:
  consumer:
    # @WebhookType event classes are discovered automatically by scanning this app's auto-configuration
    # packages (the @SpringBootApplication package, via Spring Boot's AutoConfigurationPackages) — no
    # base-package to configure. Put @WebhookType classes anywhere under com.jinternals.webhooks.sample.consumer.

    # What to do when a type is not accepted by the matched endpoint: ack-and-ignore (204) or reject (400).
    unknown-type-policy: ack-and-ignore

    # ── Correlation & trace context (SPEC §9b) ───────────────────────────────
    # The toolkit writes NOTHING to the MDC — correlation is the application's
    # concern, so there is no tracing config here. This sample binds the trace id
    # AND the stable webhook-id to the MDC itself, in trace/TraceContextFilter,
    # which runs before the webhook controller. The producer sample propagates the
    # trace id to us on the x-trace-id header (see its TraceHeaderWebhookInterceptor);
    # we read it back, so one trace id spans both services. The log pattern below
    # renders both keys on every line.

    # Best-effort in-memory dedupe on webhook-id (off by default).
    in-memory-idempotency: false

    # Per-type payload validation is declared with Bean Validation annotations on the @WebhookType classes
    # themselves (e.g. events/InvoicePaid: @NotBlank, @Positive, @Size); see SPEC.md §6a. No per-type
    # schema config is needed — the type is the schema.

    endpoints:
      # ── Multi-type endpoint (v1, symmetric HMAC) ─────────────────────────
      # One URL accepts THREE event types; each routes to its own handler. The
      # whsec_ prefix selects v1: verify with the SAME shared secret the sender
      # signed with.
      - path: /webhooks/crm
        secret: ${CRM_WEBHOOK_SECRET:whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw}
        # ── Zero-downtime secret rotation (blue/green) ─────────────────────
        # A signature made with the primary secret OR any additional secret is
        # accepted, so you can roll a new secret out to senders before retiring
        # the old one. Uncomment during a rotation window:
        # additional-secrets:
        #   - ${CRM_WEBHOOK_SECRET_OLD:whsec_OLDOLDOLDOLDOLDOLDOLDOLDOLDOLDOL}
        types:
          - contact.created
          - contact.updated
          - contact.deleted

      # ── Asymmetric endpoint (v2a, Ed25519) ───────────────────────────────
      # The SAME event types, but verified with a whpk_ Ed25519 PUBLIC key —
      # this app never holds the signing (private) key, so even a full read of
      # this config can't forge a delivery. The whpk_ prefix selects v2a.
      #
      # endpoint-id is REQUIRED for v2a and must match the producer's value
      # EXACTLY (producer-sample's demo-v2a destination). It is mixed into the
      # signed content and never travels on the wire; a signature made for a
      # different endpoint-id will not verify here. See SPEC §19i.
      #
      # contact.created arriving here routes to the very same ContactHandlers
      # #onCreated as the v1 endpoint above — verification scheme is transparent
      # to handlers; routing is by event type, not by path.
      - path: /webhooks/crm-v2a
        secret: ${CRM_V2A_PUBLIC_KEY:whpk_uWKK13PfwqyOgrqT0OrWKcS2uVD7e89+oUKnkoPjx7w=}
        endpoint-id: ${CRM_V2A_ENDPOINT_ID:ep_2fVZdC8Kx9TR4ZoCqHWt3NnLgRb}
        types:
          - contact.created
          - contact.updated
          - contact.deleted

      # ── Single-type endpoint ─────────────────────────────────────────────
      # This URL accepts ONLY invoice.paid; anything else hits the unknown-type policy.
      - path: /webhooks/billing/invoice-paid
        secret: ${BILLING_WEBHOOK_SECRET:whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw}
        types:
          - invoice.paid

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: webhooks-consumer-sample

logging:
  level:
    com.jinternals.webhooks: INFO
  # Surface the webhook correlation keys on every line: the stable webhook-id and the
  # trace id propagated from the producer. Both are bound in the MDC by this app's
  # trace/TraceContextFilter (before the first log line) and cleared in a finally.
  pattern:
    level: "%5p [webhook.id=%X{webhook.id} traceId=%X{traceId}]"
