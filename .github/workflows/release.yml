name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release to Maven Central & GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Validate release tag, POM versions & branch ancestry
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ "${VERSION}" == *-SNAPSHOT* ]]; then
            echo "::error::Tag ${TAG} points at a -SNAPSHOT version."
            exit 1
          fi

          POM_VERSION=$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
          SAMPLE_WEBHOOKS_VERSION=$(mvn -B -ntp -f webhooks-sample/pom.xml help:evaluate -Dexpression=webhooks.version -q -DforceStdout)

          if [[ "${POM_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tag ${TAG} expects pom.xml version ${VERSION}, but found ${POM_VERSION}."
            exit 1
          fi
          if [[ "${SAMPLE_WEBHOOKS_VERSION}" != "${VERSION}" ]]; then
            echo "::error::webhooks-sample/pom.xml webhooks.version (${SAMPLE_WEBHOOKS_VERSION}) does not match ${VERSION}."
            exit 1
          fi

          # Ensure the tagged commit belongs to `main` or a protected release maintenance branch (`N.x` / `N.M.x`).
          CONTAINING_BRANCHES=$(git branch -r --contains HEAD | sed 's/^[[:space:]]*//')
          echo "Branches containing ${GITHUB_SHA}:"
          echo "${CONTAINING_BRANCHES}"
          if ! echo "${CONTAINING_BRANCHES}" | grep -Eq '^origin/(main|[0-9]+\.x|[0-9]+\.[0-9]+\.x)$'; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not on main or a maintenance branch (N.x / N.M.x)."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Full quality gate (format + 100% JaCoCo + 100% PITest)
        run: mvn -B -ntp -T 1C -Pmutation,format verify

      - name: Verify standalone samples & Spring Boot AOT against release JARs
        run: |
          mvn -B -ntp install -DskipTests
          mvn -B -ntp -T 1C -Pformat -f webhooks-sample/pom.xml verify
          mvn -B -ntp -f webhooks-sample/pom.xml spring-boot:process-aot

      - name: Sign & deploy release bundle to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn -B -ntp -Prelease deploy -DskipTests
          -Dcentral.autoPublish=${{ vars.CENTRAL_AUTO_PUBLISH || 'false' }}

      - name: Extract release notes & publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s*https?://|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          notes = match.group(1).strip() if match else ""
          pathlib.Path("/tmp/release-notes.md").write_text(notes, encoding="utf-8")
          PY

          RELEASE_FLAGS=(--verify-tag --title "v${VERSION}")
          if [[ -s /tmp/release-notes.md ]]; then
            RELEASE_FLAGS+=(--notes-file /tmp/release-notes.md)
          else
            RELEASE_FLAGS+=(--generate-notes)
          fi

          # Omitting `--latest` uses GitHub's default automatic selection (date + SemVer) so a backport patch
          # (e.g. v1.0.4 on Spring Boot 4.x) does not steal the "Latest" badge after v2.0.0 (Spring Boot 5.x) ships.
          if [[ "${PRERELEASE}" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; skipping creation."
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_FLAGS[@]}"
          fi
