name: CI

on:
  push:
    branches:
      - main
      - '[0-9]+.x'
      - '[0-9]+.[0-9]+.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs immediately, but never abort an in-flight push / snapshot deploy on main or *.x.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & quality gate (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Full gate: Spotless formatting + unit tests + 100% JaCoCo line/branch coverage + 100% PIT mutation coverage.
      - name: mvn verify (format + coverage + mutation testing)
        run: mvn -B -ntp -T 1C -Pmutation,format verify

      - name: Upload coverage & mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/target/site/jacoco/
            **/target/pit-reports/
            **/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  samples:
    name: Sample apps (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # The samples consume the published starters, so install the libraries locally first
      # (tests and the quality gate already run in the `build` job).
      - name: Install libraries
        run: mvn -B -ntp install -DskipTests

      - name: Build, verify JSpecify/NullAway & test samples (with Spotless check)
        run: mvn -B -ntp -T 1C -Pformat -f webhooks-sample/pom.xml verify

      - name: Verify Spring Boot AOT processing across all sample apps
        run: mvn -B -ntp -f webhooks-sample/pom.xml spring-boot:process-aot

      # End-to-end Docker integration tests across quickstart (v1 + v2a), NATS JetStream zero-loss, and OAuth2 auth stacks.
      - name: Docker integration test (quickstart v1 + v2a)
        if: matrix.java-version == '21'
        run: bash webhooks-sample/integration-test.sh

      - name: Docker integration test (NATS JetStream zero-loss)
        if: matrix.java-version == '21'
        run: bash webhooks-sample/integration-test-nats.sh

      - name: Docker integration test (OAuth2 JWT + HMAC dual-layer auth)
        if: matrix.java-version == '21'
        run: bash webhooks-sample/integration-test-auth.sh

  javadoc:
    name: Release artifacts (sources + javadoc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Catches broken Javadoc (which would block a Maven Central release) on every PR.
      - name: Package with release profile (unsigned)
        run: mvn -B -ntp -Prelease -Dgpg.skip -DskipTests package

  publish-snapshot:
    name: Publish snapshot (Central Portal)
    needs: [build, samples, javadoc]
    if: github.event_name == 'push' && vars.ENABLE_SNAPSHOT_PUBLISH != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Check snapshot version & credentials
        id: check
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          VERSION=$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Detected project.version=${VERSION} on branch ${GITHUB_REF_NAME}"
          if [[ "${VERSION}" != *-SNAPSHOT ]]; then
            echo "::notice::Non-snapshot version (${VERSION}); skipping snapshot publish (use a v* tag to trigger release.yml)."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          elif [[ -z "${CENTRAL_USERNAME}" || -z "${CENTRAL_PASSWORD}" ]]; then
            echo "::notice::CENTRAL_USERNAME / CENTRAL_PASSWORD secrets not configured yet; skipping snapshot publish."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy -SNAPSHOT artifacts to Central Portal Snapshots
        if: steps.check.outputs.deploy == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: mvn -B -ntp -Psnapshot deploy -DskipTests
