name: Dependency vulnerability scan

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Fails on any CVSS >= 7 finding (see the `security-scan` profile in pom.xml).
      # Add an NVD API key as the NVD_API_KEY repository secret to avoid slow, throttled downloads:
      # https://nvd.nist.gov/developers/request-an-api-key
      - name: dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -Psecurity-scan verify -DskipTests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'
          if-no-files-found: ignore
          retention-days: 30
