version: 2
updates:
  # Library reactor (root pom + modules)
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.jacoco*"
          - "org.pitest*"
          - "com.diffplug.spotless*"
          - "org.owasp*"
          - "org.sonatype.central*"

  # Standalone sample apps
  - package-ecosystem: maven
    directory: /webhooks-sample
    schedule:
      interval: weekly
    groups:
      sample-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /webhooks-sample/consumer-sample
      - /webhooks-sample/producer-sample
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
